name: Deploy to cPanel

on:
  push:
    branches:
      - claude/organize-control-panel-hUe4z

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: 77.92.151.228
          username: takbulut
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: /public_html/beton/
          exclude: |
            **/.git*
            **/.git*/**
            **/config.php
            **/backups/**
            **/deploy.log
            **/.htaccess
