services:
  # ── PHP + Apache Web Sunucusu ─────────────────────────────────────
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: beton_web
    ports:
      - "8090:80"        # http://localhost:8090 ile eriş
    volumes:
      - .:/var/www/html  # Canlı kod değişikliği (geliştirme modu)
      - uploads_data:/var/www/html/uploads
      - backups_data:/var/www/html/backups
    environment:
      DB_HOST: db
      DB_NAME: beton_takip
      DB_USER: beton
      DB_PASS: Beton2024!
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - beton_net

  # ── MySQL Veritabanı ──────────────────────────────────────────────
  db:
    image: mysql:8.0
    container_name: beton_db
    ports:
      - "3307:3306"      # Laragon ile çakışmamak için 3307
    environment:
      MYSQL_DATABASE:      beton_takip
      MYSQL_USER:          beton
      MYSQL_PASSWORD:      Beton2024!
      MYSQL_ROOT_PASSWORD: BetonRoot2024!
      MYSQL_CHARSET:       utf8mb4
      MYSQL_COLLATION:     utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/init.sql:/docker-entrypoint-initdb.d/01_init.sql
    command: >
      --default-authentication-plugin=mysql_native_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --max_allowed_packet=64M
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "beton", "-pBeton2024!"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks:
      - beton_net

  # ── phpMyAdmin (isteğe bağlı — DB yönetimi için) ──────────────────
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: beton_pma
    ports:
      - "8081:80"        # http://localhost:8081
    environment:
      PMA_HOST: db
      PMA_USER: beton
      PMA_PASSWORD: Beton2024!
      UPLOAD_LIMIT: 64M
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - beton_net

volumes:
  mysql_data:
    driver: local
  uploads_data:
    driver: local
  backups_data:
    driver: local

networks:
  beton_net:
    driver: bridge
